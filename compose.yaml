# Base stack, shared by dev (compose.override.yaml, loaded automatically) and the prod image build
# (compose.prod.yaml). Production itself runs on shared hosting without Docker (README, "Production").
# The project name keeps containers, networks and volumes apart from the other local stacks.
name: kstzochar

services:
  php:
    container_name: kstzochar-php
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      DEFAULT_URI: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-kstzochar}?serverVersion=${MYSQL_SERVER_VERSION:-8.4.0}&charset=${MYSQL_CHARSET:-utf8mb4}
    # The entrypoint gives up after 60 s without a database, so start once it is healthy
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

###> doctrine/doctrine-bundle ###
  database:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: kstzochar-database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kstzochar}
      # You should definitely change the password in production
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_USER: ${MYSQL_USER:-app}
    healthcheck:
      # TCP, not the socket: the socket already answers while the init scripts run without networking
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      timeout: 5s
      retries: 5
      start_period: 60s
    # No published port here: dev publishes one on 127.0.0.1 (compose.override.yaml)
    volumes:
      - database_data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

volumes:
  caddy_data:
  caddy_config:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

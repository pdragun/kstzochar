version: '3'

includes:
    # Shared tasks (stack, shell, console, composer, cache, doctrine, code style, node): see its header
    common:
        taskfile: ./taskfiles/common.yaml
        flatten: true
    custom: # optional Taskfile.local.yml for your own tasks in this project
        taskfile: ./Taskfile.local.yml
        optional: true

tasks:
    app:up:
        desc: Build and start the Docker stack (php, database, node); startup runs pending migrations
        aliases: [up]
        cmds:
            - task: docker:up

    # Drop every table (including doctrine_migration_versions) and rebuild the schema with the migrations.
    # Recreating it (rather than only loading fixtures) also resets auto-increment ids, which the tests depend on.
    app:db:reset:
        desc: 'Drop and recreate the database schema, then load fixtures (APP_ENV=test task dbr for the test DB)'
        aliases: [dbr]
        prompt: This drops the {{default "dev" .APP_ENV}} database. Continue?
        cmds:
            - task: db:recreate

    db:recreate:
        internal: true
        cmds:
            - task: console
              vars:
                  CLI_ARGS: --env={{default "dev" .APP_ENV}} doctrine:schema:drop --force --full-database
            - task: console
              vars:
                  CLI_ARGS: --env={{default "dev" .APP_ENV}} doctrine:migrations:migrate --no-interaction
            - task: console
              vars:
                  CLI_ARGS: --env={{default "dev" .APP_ENV}} doctrine:fixtures:load --no-interaction

    # The suite mutates fixture data, so the test database is reset before every run.
    test:setup:
        desc: Recreate the test database schema (kstzochar_test) and load fixtures
        aliases: [ts, tdbr]
        cmds:
            - task: db:recreate
              vars:
                  APP_ENV: test

    phpunit:
        desc: 'Reset the test DB and run phpunit, e.g. task test -- --filter testName'
        aliases: [test]
        cmds:
            - task: test:setup
            - task: docker:exec
              vars:
                  COMMAND: php -d memory_limit=1G bin/phpunit --testdox --colors=always {{.CLI_ARGS}}

    # Checks
    check:
        desc: Run phpstan, the rector dry run and the tests
        cmds:
            - task: phpstan
            - task: rector:check
            - task: phpunit

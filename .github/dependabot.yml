# Dependabot version updates: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Symfony minor and major upgrades (8.1 -> 8.2) go by hand: extra.symfony.require
      # pins the minor, and an upgrade needs the Flex recipe updates. Patches still come.
      - dependency-name: "symfony/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      symfony:
        patterns: ["symfony/*"]
      composer-dev:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  # Base images in the Dockerfile (frankenphp, node, debian).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

  # Images in compose*.yaml (node in compose.override.yaml).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly

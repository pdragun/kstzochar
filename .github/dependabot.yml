# Dependabot version updates: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# Why the ignores below exist: docs/decisions/dependabot.md
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Symfony minor and major upgrades (8.1 -> 8.2) go by hand: extra.symfony.require
      # pins the minor, and an upgrade needs the Flex recipe updates. Patches still come.
      # Only the components on the framework's version line (8.1.* in composer.json);
      # independently versioned symfony/* packages (flex, maker-bundle, monolog-bundle,
      # webpack-encore-bundle, polyfills, contracts) still get minor and major updates.
      - { dependency-name: "symfony/browser-kit", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/cache", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/console", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/css-selector", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/debug-bundle", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/dotenv", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/expression-language", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/form", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/framework-bundle", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/html-sanitizer", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/http-client", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/intl", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/lock", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/mailer", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/notifier", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/phpunit-bridge", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/process", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/property-access", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/property-info", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/rate-limiter", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/runtime", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/security-bundle", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/serializer", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/stopwatch", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/string", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/translation", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/twig-bundle", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/validator", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/web-link", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/web-profiler-bundle", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
      - { dependency-name: "symfony/yaml", update-types: ["version-update:semver-minor", "version-update:semver-major"] }
    groups:
      symfony:
        patterns: ["symfony/*"]
        update-types: ["minor", "patch"]
      composer-dev:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm:
        update-types: ["minor", "patch"]
        # 0.x packages: a "minor" bump (0.6 -> 0.7) can break, so they come on their own.
        exclude-patterns: ["@a2lix/symfony-collection", "regenerator-runtime"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  # Base images in the Dockerfile (frankenphp, node, debian).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The prod stage copies binaries and libraries from the frankenphp (Debian) builder,
      # so debian moves to a new release only together with frankenphp, by hand.
      - dependency-name: "debian"
        update-types: ["version-update:semver-major"]
      # Node: LTS majors only, moved by hand in the Dockerfile and compose.override.yaml together.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Images in compose*.yaml (node in compose.override.yaml).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

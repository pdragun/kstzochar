# Development override, loaded automatically by `docker compose` (start the stack with `task up`).
# The php image runs as your host user (USER_UID/USER_GID, set by Task; 1000:1000 without it), so everything
# written into the bind-mounted project, var/ included, stays yours. Ports other than HTTPS listen on 127.0.0.1.
services:
  php:
    image: ${IMAGES_PREFIX:-}kstzochar-php-dev
    build:
      context: .
      target: frankenphp_dev
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    # var/ (cache, logs) lives in the bind-mounted project, so it is readable from the host
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    environment:
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
      # The site listens on the published HTTPS port, so Caddy's HTTP->HTTPS redirect keeps it
      SERVER_NAME: ${SERVER_NAME:-localhost}:${HTTPS_PORT:-18443}, php:80
      DEFAULT_URI: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-18443}
    # Dev ports above 1024, so they don't clash with a local web server; !override replaces the
    # 80/443 of compose.yaml (production) instead of adding to them
    ports: !override
      - name: http
        target: 80
        host_ip: 127.0.0.1
        published: ${HTTP_PORT:-18080}
        protocol: tcp
      - name: https
        target: ${HTTPS_PORT:-18443}
        published: ${HTTPS_PORT:-18443}
        protocol: tcp
      - name: http3
        target: ${HTTPS_PORT:-18443}
        published: ${HTTP3_PORT:-18443}
        protocol: udp
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

  # Webpack Encore: installs the npm packages, then rebuilds public/build/ on change. `task npm -- ...` and
  # `task build` run one-off containers of it.
  node:
    image: node:24-slim
    container_name: kstzochar-node
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run watch"
    environment:
      HOME: /tmp
    volumes:
      - ./:/app
    depends_on:
      # Encore copies the CKEditor files from vendor/, which the php container installs
      php:
        condition: service_healthy


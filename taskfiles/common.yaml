# Local-development tasks, included (flattened) by Taskfile.yaml. Project tasks (app:up, app:db:reset,
# test:setup, phpunit, check, ...) live in Taskfile.yaml, personal ones in the git-ignored Taskfile.local.yml.
#
# Everything runs in Docker: the dev php image runs as your host user (USER_UID/USER_GID build args,
# passed below), so files it writes into the bind-mounted project stay yours. Never run php, composer,
# bin/console or npm on the host, and don't call docker compose yourself where a task exists.
version: '3'

vars:
    UID:
        sh: id -u
    GID:
        sh: id -g

env:
    # Read by compose.override.yaml: build args of the dev php image, user of the node service
    USER_UID: '{{.UID}}'
    USER_GID: '{{.GID}}'

tasks:
    # Docker stack
    docker:up:
        desc: Build the Docker stack, install composer.lock if vendor/ is older, start it and wait until it is healthy
        cmds:
            - docker compose build
            - task: composer:install:stale
            - docker compose up -d --remove-orphans --wait

    # The entrypoint only installs into an empty vendor/, and it boots bin/console first, which fails on a
    # vendor/ older than composer.lock (a pull that adds a bundle). So the install runs before the stack
    # starts, in a one-off container without the entrypoint. The touch also covers an install that changed nothing.
    composer:install:stale:
        desc: Install the composer dependencies if composer.lock is newer than vendor/ (works while the stack is down)
        status:
            - test ! -f composer.lock || test vendor/composer/installed.json -nt composer.lock
        cmds:
            - docker compose run --rm --no-deps -T --entrypoint composer php install --no-interaction
            - touch vendor/composer/installed.json

    docker:rebuild:
        desc: Recreate the Docker stack and wait until it is healthy
        aliases: [dr]
        cmds:
            - docker compose down --remove-orphans
            - task: docker:up

    # The tags stay the same (dunglas/frankenphp:1-php8.5, mysql:8.4, node:24-slim), but a plain build keeps
    # the image pulled the first time. The Dockerfile's base images are pulled by name: build --pull alone
    # leaves the local tag on the old image, and the next build (task up) would rebuild from that again.
    # --no-cache reruns the apt and extension layers too. Changing a tag itself (PHP 8.5 -> 8.6) is a
    # Dockerfile/compose edit.
    docker:update:
        desc: Pull the newest base and service images for the pinned tags, rebuild without cache and recreate the stack
        aliases: [update]
        cmds:
            - docker compose --profile '*' pull --ignore-buildable
            # FROM lines that name an image (with a tag or registry path), not an earlier stage, skipping
            # --platform and other flags; COPY --from=<image> pulls an image too
            - >-
              awk 'toupper($1) == "FROM" { for (i = 2; i <= NF; i++) if ($i !~ /^--/) { print $i; break } }
              toupper($1) == "COPY" { for (i = 2; i <= NF; i++) if ($i ~ /^--from=/) print substr($i, 8) }' Dockerfile
              | grep -E '[:/]' | sort -u | xargs -rn1 docker pull
            - docker compose build --pull --no-cache
            # docker:up without its build, which the one above makes redundant
            - task: composer:install:stale
            - docker compose up -d --remove-orphans --wait
            - task: docker:exec
              vars:
                  COMMAND: php -v

    app:down:
        desc: Stop the Docker stack (keeps the volumes)
        aliases: [down]
        cmds:
            - docker compose down --remove-orphans

    app:ps:
        desc: Show the services, their health and their published ports
        aliases: [ps, ports]
        cmds:
            - docker compose ps

    # Returns, so agents can run it: the allow rules cover task logs -- *, so the last --follow=false wins over a
    # -f among the arguments. app:follow-logs keeps streaming, and is named so those rules don't cover it.
    app:logs:
        desc: 'Show the last 200 log lines (-n for more), e.g. task logs -- php or task logs -- -n 1000 php'
        aliases: [logs]
        cmds:
            - docker compose logs --tail=200 {{.CLI_ARGS}} --follow=false

    app:follow-logs:
        desc: 'Follow the logs until Ctrl+C, e.g. task follow -- php'
        aliases: [follow]
        interactive: true
        cmds:
            - docker compose logs -f {{.CLI_ARGS}}

    docker:exec:
        desc: 'Run COMMAND in the php service (default: an interactive shell), e.g. task docker:exec COMMAND="php -v"'
        interactive: true
        cmds:
            # A TTY only when stdin is a terminal, so prompts work for you and pipes or agents still get -T
            - docker compose exec $([ -t 0 ] || echo -T) php {{default "bash" .COMMAND}}

    shell:
        desc: Open a shell in the php service
        aliases: [sh]
        cmds:
            - task: docker:exec

    db:shell:
        desc: Open the database client as the application user
        aliases: [dbsh]
        interactive: true
        cmds:
            - >-
              docker compose exec $([ -t 0 ] || echo -T) database sh -c 'exec "$(command -v mariadb || command -v mysql)"
              -u"${MARIADB_USER:-$MYSQL_USER}" -p"${MARIADB_PASSWORD:-$MYSQL_PASSWORD}" "${MARIADB_DATABASE:-$MYSQL_DATABASE}"'

    db:grant-test:
        desc: Grant the app user the <database>_test databases on an existing volume (restarts the database once)
        cmds:
            - sh taskfiles/db-grant-test.sh

    # Checks
    # .claude/settings.local.json too: "don't ask again" adds its rules there. The risky commands are in the script.
    check:permissions:
        desc: Check the allow lists of .claude/settings.json and settings.local.json (tasks exist, risky commands still prompt)
        silent: true
        cmds:
            - |
              allow=$(jq -s '[.[].permissions.allow[]?]' $(ls .claude/settings.json .claude/settings.local.json 2>/dev/null) /dev/null) || exit 1
              missing=$(task --list-all --json | jq -r --argjson allow "$allow" '
                  [.tasks[] | .name, .aliases[]] as $known
                  | $allow[]
                  | capture("^Bash\\(task (?<t>[^ :)]+(:[^ :)*]+)*)").t
                  | select((IN("--list", "--list-all", "-l", "-a", "--version") | not) and (IN($known[]) | not))')
              if [ -n "$missing" ]; then
                  echo "Tasks in the .claude/settings*.json allow lists that no Taskfile defines:" >&2
                  echo "$missing" >&2
                  exit 1
              fi
            - sh taskfiles/check-permissions.sh

    # One-off as root in a new container, so it works while the stack is down and needs no sudo
    fix-perms:
        desc: Give root-owned files (project, Caddy volumes) back to the host user, e.g. after a stack that ran as root
        cmds:
            - docker compose run --rm --no-deps -u root --entrypoint chown php -R {{.UID}}:{{.GID}} /app /data /config

    # Symfony
    console:
        desc: 'Run bin/console, e.g. task console -- debug:router'
        aliases: [c]
        cmds:
            - task: docker:exec
              vars:
                  COMMAND: bin/console {{.CLI_ARGS}}

    symfony:cache:clear:
        desc: Remove var/cache/<env> and clear the cache without warmup (APP_ENV=test task ... for the test cache)
        cmds:
            - task: docker:exec
              vars:
                  COMMAND: rm -rf var/cache/{{default "dev" .APP_ENV}}
            - task: docker:exec
              vars:
                  COMMAND: bin/console --env={{default "dev" .APP_ENV}} cache:clear --no-warmup

    symfony:cache:warmup:
        desc: Warm the cache
        cmds:
            - task: docker:exec
              vars:
                  COMMAND: bin/console --env={{default "dev" .APP_ENV}} cache:warmup

    symfony:cache:clear-with-warmup:
        desc: Clear and warm the cache
        aliases: [cc]
        cmds:
            - task: symfony:cache:clear
            - task: symfony:cache:warmup

    app:install:
        desc: Install the composer dependencies, rebuild the cache and install the bundle assets
        aliases: [install]
        cmds:
            - task: composer:install
            - task: symfony:cache:clear-with-warmup
            - task: console
              vars:
                  CLI_ARGS: assets:install

    # Composer
    composer:
        desc: 'Run composer, e.g. task composer -- require foo/bar'
        cmds:
            - task: docker:exec
              vars:
                  COMMAND: composer {{.CLI_ARGS}}

    composer:install:
        desc: Install the composer dependencies
        aliases: [ci]
        cmds:
            - task: docker:exec
              vars:
                  COMMAND: composer install --no-interaction

    # Doctrine
    doctrine:schema:validate:
        desc: 'Validate the mapping and the database schema, e.g. task dv -- --env=test'
        aliases: [dv]
        cmds:
            - task: console
              vars:
                  CLI_ARGS: doctrine:schema:validate {{.CLI_ARGS}}

    doctrine:migrations:status:
        desc: Show the migration status
        aliases: [dms]
        preconditions: &migrations
            - sh: test -n "$(find migrations -name '*.php' -print -quit 2>/dev/null)"
              msg: This project has no migrations; see AGENTS.md for how its schema is built.
        cmds:
            - task: console
              vars:
                  CLI_ARGS: doctrine:migrations:status {{.CLI_ARGS}}

    doctrine:migrations:migrate:
        desc: Run the pending migrations
        aliases: [dmm]
        preconditions: *migrations
        cmds:
            - task: console
              vars:
                  CLI_ARGS: doctrine:migrations:migrate --no-interaction {{.CLI_ARGS}}

    doctrine:migrations:migrate:prev:
        desc: Roll back the last migration
        aliases: [dmmprev]
        preconditions: *migrations
        cmds:
            - task: console
              vars:
                  CLI_ARGS: doctrine:migrations:migrate prev --no-interaction

    doctrine:migrations:diff:
        desc: Generate a migration from the mapping changes (review it before committing)
        aliases: [dmd]
        preconditions:
            - sh: test -d vendor/doctrine/doctrine-migrations-bundle
              msg: doctrine/doctrine-migrations-bundle is not installed; see AGENTS.md for how this project's schema is built.
        cmds:
            - task: console
              vars:
                  CLI_ARGS: doctrine:migrations:diff {{.CLI_ARGS}}

    # Code quality
    cs:check:
        desc: Show the php-cs-fixer changes (dry run)
        preconditions: &php-cs-fixer
            - sh: test -x vendor/bin/php-cs-fixer
              msg: php-cs-fixer is not installed in this project (task composer -- require --dev friendsofphp/php-cs-fixer).
        cmds:
            - task: docker:exec
              vars:
                  COMMAND: vendor/bin/php-cs-fixer fix --dry-run --diff {{.CLI_ARGS}}

    cs:fix:
        desc: Apply the php-cs-fixer changes
        aliases: [cs]
        preconditions: *php-cs-fixer
        cmds:
            - task: docker:exec
              vars:
                  COMMAND: vendor/bin/php-cs-fixer fix {{.CLI_ARGS}}

    phpstan:
        desc: Run phpstan
        aliases: [stan]
        preconditions:
            - sh: test -x vendor/bin/phpstan
              msg: phpstan is not installed in this project.
        cmds:
            # The Symfony extension reads the container's XML dump, which only a kernel boot keeps current: booting
            # the dev kernel (debug) rebuilds it when a service or its configuration changed; a missing one needs cc.
            # The path as phpstan resolves it (the config file it picks or -c names, includes,
            # %currentWorkingDirectory%), which is absolute in the container's /app.
            - |
              config=; next=
              for arg in {{.CLI_ARGS}}; do
                  if [ -n "$next" ]; then config="-c $arg"; next=; continue; fi
                  case "$arg" in -c|--configuration) next=1;; -c*) config="-c ${arg#-c}";; --configuration=*) config="-c ${arg#*=}";; esac
              done
              # No terminal on stdin, so no TTY, and PHP's notices on stderr: only the JSON on stdout
              params=$(task docker:exec COMMAND="php -d display_errors=stderr vendor/bin/phpstan dump-parameters --json $config" < /dev/null) \
                  && xml=$(printf '%s' "$params" | jq -r '.symfony.containerXmlPath // empty') \
                  || { echo "phpstan: can't read its parameters, so the container XML dump is left as it is" >&2; exit 0; }
              if [ -z "$xml" ]; then exit 0; fi
              xml=${xml#/app/}
              # The environment the path names (var/cache/<env>/...), dev unless it says otherwise
              env=$(printf '%s\n' "$xml" | sed -n 's|.*var/cache/\([^/]*\)/.*|\1|p'); env=${env:-dev}
              if [ -f "$xml" ]; then task docker:exec COMMAND="bin/console --env=$env about" > /dev/null; else APP_ENV=$env task cc; fi
            - task: docker:exec
              vars:
                  COMMAND: vendor/bin/phpstan analyse --memory-limit=1G {{.CLI_ARGS}}

    rector:check:
        desc: Show the rector changes (dry run)
        preconditions: &rector
            - sh: test -x vendor/bin/rector
              msg: rector is not installed in this project.
        cmds:
            - task: docker:exec
              vars:
                  COMMAND: vendor/bin/rector process --dry-run {{.CLI_ARGS}}

    rector:fix:
        desc: Apply the rector changes
        aliases: [rector]
        preconditions: *rector
        cmds:
            - task: docker:exec
              vars:
                  COMMAND: vendor/bin/rector process {{.CLI_ARGS}}

    # Node (the node service of compose.override.yaml, as your user)
    node:exec:
        desc: 'Run COMMAND in a one-off node container (default: a shell), e.g. task node:exec COMMAND="node -v"'
        interactive: true
        preconditions: &node
            # --profile '*' also lists a node service that is only in a profile
            - sh: docker compose --profile '*' config --services | grep -qx node
              msg: This project has no node service.
        cmds:
            - docker compose run --rm --no-deps $([ -t 0 ] || echo -T) node {{default "bash" .COMMAND}}

    npm:
        desc: 'Run npm in the node service, e.g. task npm -- outdated'
        preconditions: *node
        cmds:
            - task: node:exec
              vars:
                  COMMAND: npm {{.CLI_ARGS}}

    assets:build:
        desc: Build the production assets (the node service rebuilds dev assets on change while the stack runs)
        aliases: [build]
        preconditions: *node
        cmds:
            - task: node:exec
              vars:
                  COMMAND: npm run build
